<!DOCTYPE html>
<html>
<head>
    <title>Student Feedback</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        form {
            background-color: white;
            width: 60%;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
        }

        input, select, textarea {
            width: 80%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 10px 30px;
        }
    </style>
</head>

<body>

    <h1>Student Feedback Form</h1>

    <form>

        <label>Course Name</label><br>
        <input type="text" name="course"><br>

        <label>Faculty Name</label><br>
        <input type="text" name="faculty"><br>

        <label>Student Name</label><br>
        <input type="text" name="student"><br>

        <label>Register Number</label><br>
        <input type="text" name="register"><br>

        <label>Department</label><br>
        <input type="text" name="department"><br>

        <label>Rating</label><br>
        <select name="rating">
            <option>5 - Excellent</option>
            <option>4 - Very Good</option>
            <option>3 - Good</option>
            <option>2 - Average</option>
            <option>1 - Poor</option>
        </select><br>

        <label>Feedback / Comments</label><br>
        <textarea rows="5" placeholder="Enter your feedback"></textarea><br>

        <button type="submit">Submit Feedback</button>

    </form>

</body>
</html>
